services:
  gsuid-adapter:
    build: .
    container_name: gsuid-adapter
    restart: always
    # 共享宿主机网络命名空间：适配器访问宿主机上的 GScore / 载体 HTTP API 时
    # 使用 127.0.0.1 直连。GsCore 仅信任回环地址（TRUSTED_IPS），
    # Docker 网桥 IP 访问其 WS 端点会被 403 拒绝，故本地部署推荐此模式。
    # 注意：host 模式下反向 WS 直接监听宿主机 3002 端口，无需也不支持 ports 映射。
    network_mode: host
    volumes:
      - ./config.json:/app/config.json  # 配置文件
      - ./logs:/app/logs                # 日志目录
    environment:
      - NODE_ENV=production
